<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#17212b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Code Calc"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.svg"><title>Electrical Code Calculator</title><style>
:root{--navy:#17212b;--navy2:#202d38;--steel:#344653;--amber:#f0a928;--muted:#aeb9c0}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#101820;color:#f9fafb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{max-width:760px;margin:auto;padding:18px 14px 26px}.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.logo{border:2px solid var(--amber);border-radius:8px;width:40px;height:40px;display:grid;place-items:center;color:var(--amber);font-size:22px}h1{font-size:19px;margin:0}.sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:4px}.card{background:var(--navy2);border:1px solid var(--steel);border-radius:12px;overflow:hidden}.head{padding:11px 14px;background:#263640;border-bottom:1px solid var(--steel);font-size:11px;font-weight:800;letter-spacing:.1em}.formula{padding:12px 14px;color:#d3dbe0;font:13px ui-monospace,monospace}.display{margin:0 14px 14px;background:#0e151b;border:1px solid #596a75;border-radius:8px;padding:13px 15px;text-align:right}.input{font:750 42px ui-monospace,monospace;min-height:50px;overflow-wrap:anywhere}.result{display:flex;justify-content:space-between;align-items:end;border-top:1px solid #33434e;margin-top:10px;padding-top:9px}.label{font-size:10px;color:#91a0a9;letter-spacing:.1em}.answer{font:900 36px ui-monospace,monospace;color:var(--amber);margin-top:3px}.unit{font-size:11px;color:#91a0a9}.note{padding:0 14px 14px;font-size:11px;color:#98a6ae;line-height:1.45}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}button{min-height:64px;border:1px solid #4a5b66;border-radius:9px;background:#273640;color:#f7f9fa;font-size:25px;font-weight:700}button:active{background:#334650}.action{font-size:14px;color:#d4dce0}.calc{background:#8a5b0e;border-color:#e3a52a;font-size:13px}.zero{grid-column:span 2}.foot{text-align:center;font-size:10px;color:#65747d;margin-top:12px}@media(max-width:420px){.input{font-size:34px}.answer{font-size:30px}button{min-height:58px}}
</style></head><body><main><div class="top"><div class="logo">⚡</div><div><h1>Electrical Code Calculator</h1><div class="sub">Field Calculation Tool</div></div></div><section class="card"><div class="head">LOAD / CURRENT CALCULATION</div><div class="formula">ROUND UP: x ÷ 3.412 ÷ 240</div><div class="display"><div id="input" class="input" aria-live="polite">0</div><div class="result"><div><div class="label">CALCULATED RESULT</div><div id="answer" class="answer" aria-live="polite">0</div></div><div class="unit">WHOLE NUMBER</div></div></div><div class="note">Enter the value for <b>x</b>. The calculator divides by 3.412 and 240, then rounds the result upward to the next whole number.</div></section><div class="keys"><button class="action" data-action="clear">CLEAR</button><button class="action" data-action="back">⌫ DELETE</button><button class="calc" data-action="calculate">CALCULATE</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button class="zero" data-key="0">0</button><button data-key=".">.</button></div><div class="foot">ELECTRICAL CODE CALCULATOR • v1.1</div></main><script>
(()=>{const input=document.getElementById('input'),answer=document.getElementById('answer');let value='';function render(){input.textContent=value||'0';const n=Number(value);answer.textContent=value!==''&&Number.isFinite(n)&&n>=0?String(Math.ceil(n/3.412/240)):'0'}document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const k=b.dataset.key;if(k==='.'&&value.includes('.'))return;if(value==='0'&&k!=='.')value=k;else if(value.length<15)value+=k;render()});document.querySelector('[data-action="clear"]').onclick=()=>{value='';render()};document.querySelector('[data-action="back"]').onclick=()=>{value=value.slice(0,-1);render()};document.querySelector('[data-action="calculate"]').onclick=render;document.addEventListener('keydown',e=>{if((e.key>='0'&&e.key<='9')||e.key==='.'){document.querySelector('[data-key="'+e.key+'"]').click()}else if(e.key==='Backspace')document.querySelector('[data-action="back"]').click();else if(e.key==='Escape')document.querySelector('[data-action="clear"]').click();else if(e.key==='Enter')render()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render()})();
</script></body></html>
